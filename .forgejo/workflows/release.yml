name: Release Workflow

on:
    push:
        tags: ['*']

jobs:
    release:
        runs-on: ubuntu-latest
        container:
            image: code.iseard.media/michael/kudos-ci:php8.2
        steps:
            - name: Checkout code
              uses: https://github.com/actions/checkout@v7

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              uses: https://github.com/actions/cache@v6
              with:
                path: ${{ steps.composer-cache.outputs.dir }}
                key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: |
                npm ci
                composer install --no-ansi --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

            - name: Build front-end assets
              run: npm run build

            - name: Create zip archive
              run: |
                  composer run make-zip
                  mkdir -p dist && cp kudos-donations.zip dist/

            - name: Upload artifact
              uses: https://code.forgejo.org/forgejo/upload-artifact@v4
              with:
                  name: release
                  path: kudos-donations.zip

            - name: Publish Forgejo release
              uses: https://code.forgejo.org/actions/forgejo-release@v2
              with:
                  direction: upload
                  url: ${{ github.server_url }}
                  repo: ${{ github.repository }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref_name }}
                  release-dir: dist
                  prerelease: ${{ contains(github.ref_name, '-') }}
                  release-notes: |
                      ## What's Changed
                      - Automatically generated release.

    # Publishes stable tags (e.g. v4.3.0, not v4.3.0-beta1) to the WordPress.org
    # plugin directory. Needs repository secrets SVN_USERNAME and SVN_PASSWORD
    # (the SVN password from your WordPress.org profile, not your login password).
    wordpress-org:
        needs: release
        if: ${{ !contains(github.ref_name, '-') }}
        runs-on: ubuntu-latest
        container:
            image: code.iseard.media/michael/kudos-ci:php8.2
        steps:
            - name: Checkout code
              uses: https://github.com/actions/checkout@v7

            - name: Download release zip
              uses: https://code.forgejo.org/forgejo/download-artifact@v4
              with:
                  name: release
                  path: dist

            - name: Deploy to WordPress.org SVN
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
              run: bash bin/deploy-wporg.sh dist/kudos-donations.zip "${{ github.ref_name }}"
