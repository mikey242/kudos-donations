name: Release Workflow

on:
    push:
        tags: ['*']

jobs:
    release:
        runs-on: ubuntu-latest
        container:
            image: code.iseard.media/michael/kudos-ci:php8.2
        steps:
            - name: Checkout code
              uses: https://github.com/actions/checkout@v7

            - name: Get composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies
              uses: https://github.com/actions/cache@v6
              with:
                path: ${{ steps.composer-cache.outputs.dir }}
                key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
                restore-keys: ${{ runner.os }}-composer-

            - name: Install dependencies
              run: |
                npm ci
                composer install --no-ansi --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

            - name: Build front-end assets
              run: npm run build

            - name: Create zip archive
              run: |
                  # TEMPORARY: wp-cli stable (2.12.0) bundles Composer 2.2.25, which rejects
                  # GitHub's hyphenated Actions token format (ghs_<id>_<base64url-JWT>) and
                  # fails with "Failed to get composer instance". The nightly bundles Composer
                  # 2.10.2, which accepts it. Roll back to the stable phar — and to
                  # dist-archive-command 3.1.0, which is what wp-cli 2.12 supports — once a
                  # patched wp-cli stable ships.
                  curl -o wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli-nightly.phar
                  chmod +x wp-cli.phar
                  php wp-cli.phar package install wp-cli/dist-archive-command:3.2.2 --allow-root
                  composer run make-zip
                  mkdir -p dist && cp kudos-donations.zip dist/

            - name: Upload artifact
              uses: https://code.forgejo.org/forgejo/upload-artifact@v4
              with:
                  name: release
                  path: kudos-donations.zip

            - name: Publish Forgejo release
              uses: https://code.forgejo.org/actions/forgejo-release@v2
              with:
                  direction: upload
                  url: ${{ github.server_url }}
                  repo: ${{ github.repository }}
                  token: ${{ secrets.GITHUB_TOKEN }}
                  tag: ${{ github.ref_name }}
                  release-dir: dist
                  release-notes: |
                      ## What's Changed
                      - Automatically generated release.
